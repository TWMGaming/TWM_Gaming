name: Daily game-news discovery
on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Taipei (UTC+8)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: calendar-daily-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official-domain news candidates
        run: python scripts/daily_check.py
      - name: Commit review queue if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily game news review queue'
            git push
          fi
